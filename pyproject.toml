[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "header-date"
version = "0.1.0"
description = "Parse and format HTTP dates, with the weekday checked"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["http", "date", "rfc7231", "rfc1123", "parser", "strict"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/header-date"
Issues = "https://github.com/sandeshbagmare/header-date/issues"
Changelog = "https://github.com/sandeshbagmare/header-date/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/header_date"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
